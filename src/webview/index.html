<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Stagehand</title>
  <style>
    /* Fallbacks are for the standalone page (browser/Playwright); inside VS Code the theme variables win. */
    body { font-family: var(--vscode-font-family, system-ui, sans-serif); font-size: var(--vscode-font-size, 13px); color: var(--vscode-foreground, #333); background: var(--vscode-panel-background, #fff); margin: 0; padding: 0; }
    #app { display: flex; height: 100vh; }
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .toolbar { flex: none; display: flex; justify-content: flex-end; padding: 2px 8px; border-bottom: 1px solid var(--vscode-panel-border, #ccc); }
    .refresh { font: inherit; color: var(--vscode-foreground, #333); background: none; border: none; padding: 1px 6px; cursor: pointer; }
    .refresh:hover { background: var(--vscode-toolbar-hoverBackground, #e0e0e0); }
    .commits { flex: 1; min-height: 0; overflow: auto; outline: none; position: relative; }
    .spacer { width: 1px; }
    .rows { position: absolute; top: 0; left: 0; right: 0; }
    .details { width: 40%; overflow: auto; padding: 8px; border-left: 1px solid var(--vscode-panel-border, #ccc); }
    .row { position: absolute; left: 0; right: 0; box-sizing: border-box; height: 22px; display: flex; gap: 12px; padding: 0 8px; line-height: 22px; white-space: nowrap; } /* height = ROW_HEIGHT in main.ts */
    .row:hover { background: var(--vscode-list-hoverBackground, #f0f0f0); }
    .row.selected { background: var(--vscode-list-inactiveSelectionBackground, #e4e6f1); }
    .commits:focus .row.selected { background: var(--vscode-list-activeSelectionBackground, #0060c0); color: var(--vscode-list-activeSelectionForeground, #fff); }
    .commits:focus .row.selected > * { color: inherit; }
    .subject { flex: 1; overflow: hidden; text-overflow: ellipsis; }
    .author, .date, .hash { color: var(--vscode-descriptionForeground, #717171); }
    .author { width: 140px; overflow: hidden; text-overflow: ellipsis; }
    .date { width: 110px; }
    .hash { flex: none; width: 8ch; font-family: var(--vscode-editor-font-family, monospace); }
    .refs { flex: none; display: flex; gap: 4px; align-items: center; }
    .ref { line-height: 16px; padding: 0 6px; border-radius: 8px; font-size: 0.9em; }
    .ref-branch { color: var(--vscode-badge-foreground, #fff); background: var(--vscode-badge-background, #4d4d4d); }
    .ref-tag { color: var(--vscode-gitDecoration-addedResourceForeground, #587c0c); border: 1px solid currentColor; line-height: 14px; }
    .ref-head { color: var(--vscode-button-foreground, #fff); background: var(--vscode-gitDecoration-modifiedResourceForeground, #895503); font-weight: bold; }
    .row.head .subject { font-weight: bold; }
    .full-message { margin: 0 0 8px; white-space: pre-wrap; font-family: inherit; }
    .field { display: flex; gap: 8px; align-items: baseline; line-height: 22px; }
    .label { flex: none; width: 60px; color: var(--vscode-descriptionForeground, #717171); }
    .hash-value, .parents-value { font-family: var(--vscode-editor-font-family, monospace); word-break: break-all; }
    .copy { font: inherit; color: var(--vscode-button-foreground, #fff); background: var(--vscode-button-background, #0060c0); border: none; padding: 1px 8px; cursor: pointer; }
    .files { margin-top: 8px; border-top: 1px solid var(--vscode-panel-border, #ccc); padding-top: 4px; }
    .file { display: flex; gap: 8px; line-height: 22px; white-space: nowrap; user-select: none; }
    .file:hover { background: var(--vscode-list-hoverBackground, #f0f0f0); cursor: pointer; }
    .file:focus { outline: 1px solid var(--vscode-focusBorder, #0090f1); outline-offset: -1px; }
    .status { flex: none; width: 1.5ch; font-weight: bold; font-family: var(--vscode-editor-font-family, monospace); }
    .status-A { color: var(--vscode-gitDecoration-addedResourceForeground, #587c0c); }
    .status-M { color: var(--vscode-gitDecoration-modifiedResourceForeground, #895503); }
    .status-D { color: var(--vscode-gitDecoration-deletedResourceForeground, #ad0707); }
    .status-R { color: var(--vscode-gitDecoration-renamedResourceForeground, #007100); }
    .path { overflow: hidden; text-overflow: ellipsis; }
    .binary { color: var(--vscode-descriptionForeground, #717171); font-style: italic; }
    .banner { display: block; margin-bottom: 4px; padding: 4px 8px; border-left: 3px solid var(--vscode-editorWarning-foreground, #bf8803); background: var(--vscode-inputValidation-warningBackground, #fff4d6); }
    .banner-error { border-left-color: var(--vscode-errorForeground, #a1260d); background: var(--vscode-inputValidation-errorBackground, #fde8e6); }
    .menu { position: fixed; z-index: 1; padding: 4px 0; min-width: 120px; color: var(--vscode-menu-foreground, #333); background: var(--vscode-menu-background, #fff); border: 1px solid var(--vscode-menu-border, #ccc); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25); }
    .menu-item { display: block; width: 100%; text-align: left; font: inherit; color: inherit; background: none; border: none; padding: 2px 16px; cursor: pointer; }
    .menu-item:hover, .menu-item:focus { outline: none; color: var(--vscode-menu-selectionForeground, #fff); background: var(--vscode-menu-selectionBackground, #0060c0); }
    .message { display: block; padding: 8px; white-space: pre-wrap; color: var(--vscode-descriptionForeground, #717171); }
    .state-git { color: var(--vscode-errorForeground, #a1260d); font-family: var(--vscode-editor-font-family, monospace); }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="main.js"></script>
</body>
</html>
