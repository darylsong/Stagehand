<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Stagehand</title>
  <style>
    /* Fallbacks are for the standalone page (browser/Playwright); inside VS Code the theme variables win. */
    body { font-family: var(--vscode-font-family, system-ui, sans-serif); font-size: var(--vscode-font-size, 13px); color: var(--vscode-foreground, #333); background: var(--vscode-panel-background, #fff); margin: 0; padding: 0; }
    #app { display: flex; height: 100vh; }
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .toolbar { flex: none; display: flex; justify-content: flex-end; padding: 2px 8px; border-bottom: 1px solid var(--vscode-panel-border, #ccc); }
    .refresh { font: inherit; color: var(--vscode-foreground, #333); background: none; border: none; padding: 1px 6px; cursor: pointer; }
    .refresh:hover { background: var(--vscode-toolbar-hoverBackground, #e0e0e0); }
    .commits { flex: 1; min-height: 0; overflow: auto; outline: none; position: relative; }
    .spacer { width: 1px; }
    .rows { position: absolute; top: 0; left: 0; right: 0; }
    .details { flex: none; width: 40%; min-width: 150px; max-width: calc(100% - 150px); display: flex; flex-direction: column; }
    .splitter { flex: none; background: var(--vscode-panel-border, #ccc); background-clip: content-box; touch-action: none; }
    .splitter-vertical { width: 1px; padding: 0 2px; margin: 0 -2px; z-index: 2; cursor: col-resize; }
    .splitter-horizontal { height: 1px; padding: 2px 0; margin: -2px 0; z-index: 1; cursor: row-resize; }
    .splitter:hover, .splitter:active { background-color: var(--vscode-sash-hoverBorder, #0090f1); }
    .files { flex: none; height: 50%; min-height: 40px; max-height: calc(100% - 40px); box-sizing: border-box; overflow: auto; padding: 4px 8px; }
    .info { flex: 1; min-height: 0; overflow: auto; padding: 8px; }
    .commits { container-type: inline-size; }
    /* height = ROW_HEIGHT in main.ts; right padding keeps the hash clear of an overlay scrollbar. */
    .row { position: absolute; left: 0; right: 0; box-sizing: border-box; height: 22px; display: flex; gap: 12px; padding: 0 16px 0 8px; line-height: 22px; white-space: nowrap; }
    .row:hover { background: var(--vscode-list-hoverBackground, #f0f0f0); }
    .row.selected { background: var(--vscode-list-inactiveSelectionBackground, #e4e6f1); }
    .commits:focus .row.selected { background: var(--vscode-list-activeSelectionBackground, #0060c0); color: var(--vscode-list-activeSelectionForeground, #fff); }
    .commits:focus .row.selected :is(.subject, .ref-name, .author, .date, .hash) { color: inherit; }
    /* The subject column: subject text, then labels at its right end. The subject shrinks to half first; then the label name shrinks (icons stay). */
    .title { flex: 1; min-width: 0; display: flex; gap: 8px; }
    .subject { flex: 1 1 auto; min-width: calc(50% - 8px); overflow: hidden; text-overflow: ellipsis; }
    .author, .date, .hash { flex: none; overflow: hidden; text-overflow: ellipsis; color: var(--vscode-descriptionForeground, #717171); }
    .author { width: 140px; }
    .date { width: 140px; }
    .hash { width: 8ch; font-family: var(--vscode-editor-font-family, monospace); }
    @container (max-width: 620px) { .author { display: none; } }
    @container (max-width: 460px) { .date { display: none; } }
    .row.merge .subject { color: var(--vscode-descriptionForeground, #717171); }
    .refs { flex: 0 0 auto; max-width: 50%; min-width: 0; display: flex; gap: 4px; align-items: center; }
    .ref-icons { flex: none; display: flex; }
    .ref-icons > .ref + .ref { margin-left: -6px; } /* stacked, like Rider */
    .ref { width: 14px; height: 14px; }
    .ref path, .ref circle { stroke: var(--vscode-panel-background, #fff); stroke-width: 1; }
    .ref-head { fill: var(--vscode-charts-orange, #d18616); }
    .ref-local { fill: var(--vscode-charts-green, #388a34); }
    .ref-remote { fill: var(--vscode-charts-purple, #652d90); }
    .ref-tag path { fill: none; stroke: var(--vscode-charts-yellow, #bf8803); stroke-width: 1.5; }
    .ref-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; direction: rtl; color: var(--vscode-descriptionForeground, #717171); }
    .ref-name > span { direction: ltr; unicode-bidi: isolate; }
    .row.head .subject { font-weight: bold; }
    .message-subject { font-weight: bold; white-space: pre-wrap; }
    .message-body { margin: 4px 0 8px; white-space: pre-wrap; font-family: inherit; }
    .message-body:empty { display: none; }
    .commit-line { margin: 8px 0 4px; color: var(--vscode-descriptionForeground, #717171); }
    .detail-refs { display: flex; flex-wrap: wrap; gap: 4px 10px; margin: 2px 0; }
    .detail-ref { display: inline-flex; gap: 4px; align-items: center; }
    .detail-ref .ref-name { direction: ltr; }
    .in-branches { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; line-height: 22px; }
    .branches-toggle { font: inherit; color: var(--vscode-textLink-foreground, #006ab1); background: none; border: none; padding: 0; cursor: pointer; }
    .branch-list { flex-basis: 100%; }
    .field { display: flex; gap: 8px; align-items: baseline; line-height: 22px; }
    .label { flex: none; width: 60px; color: var(--vscode-descriptionForeground, #717171); }
    .hash-value, .parents-value { font-family: var(--vscode-editor-font-family, monospace); word-break: break-all; }
    .copy { font: inherit; color: var(--vscode-button-foreground, #fff); background: var(--vscode-button-background, #0060c0); border: none; padding: 1px 8px; cursor: pointer; }
    .folder { display: flex; gap: 4px; line-height: 22px; white-space: nowrap; user-select: none; cursor: pointer; }
    .folder:hover { background: var(--vscode-list-hoverBackground, #f0f0f0); }
    .folder:focus { outline: 1px solid var(--vscode-focusBorder, #0090f1); outline-offset: -1px; }
    .twisty { flex: none; width: 10px; text-align: center; transition: transform 0.1s; }
    .collapsed > .folder .twisty { transform: rotate(-90deg); }
    .collapsed > .folder-children { display: none; }
    .count { color: var(--vscode-descriptionForeground, #717171); }
    .file { display: flex; gap: 8px; line-height: 22px; white-space: nowrap; user-select: none; }
    .file:hover { background: var(--vscode-list-hoverBackground, #f0f0f0); cursor: pointer; }
    .file:focus { outline: 1px solid var(--vscode-focusBorder, #0090f1); outline-offset: -1px; }
    .status { flex: none; width: 1.5ch; font-weight: bold; font-family: var(--vscode-editor-font-family, monospace); }
    .status-A { color: var(--vscode-gitDecoration-addedResourceForeground, #587c0c); }
    .status-M { color: var(--vscode-gitDecoration-modifiedResourceForeground, #895503); }
    .status-D { color: var(--vscode-gitDecoration-deletedResourceForeground, #ad0707); }
    .status-R { color: var(--vscode-gitDecoration-renamedResourceForeground, #007100); }
    .path { overflow: hidden; text-overflow: ellipsis; }
    .binary { color: var(--vscode-descriptionForeground, #717171); font-style: italic; }
    .banner { display: block; margin-bottom: 4px; padding: 4px 8px; border-left: 3px solid var(--vscode-editorWarning-foreground, #bf8803); background: var(--vscode-inputValidation-warningBackground, #fff4d6); }
    .banner-error { border-left-color: var(--vscode-errorForeground, #a1260d); background: var(--vscode-inputValidation-errorBackground, #fde8e6); }
    .menu { position: fixed; z-index: 1; padding: 4px 0; min-width: 120px; color: var(--vscode-menu-foreground, #333); background: var(--vscode-menu-background, #fff); border: 1px solid var(--vscode-menu-border, #ccc); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25); }
    .menu-item { display: block; width: 100%; text-align: left; font: inherit; color: inherit; background: none; border: none; padding: 2px 16px; cursor: pointer; }
    .menu-item:hover, .menu-item:focus { outline: none; color: var(--vscode-menu-selectionForeground, #fff); background: var(--vscode-menu-selectionBackground, #0060c0); }
    .message { display: block; padding: 8px; white-space: pre-wrap; color: var(--vscode-descriptionForeground, #717171); }
    .state-git { color: var(--vscode-errorForeground, #a1260d); font-family: var(--vscode-editor-font-family, monospace); }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="main.js"></script>
</body>
</html>
